# Alembic configuration file
# Documentação: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Caminho para os scripts de migração
script_location = alembic

# Template de nomenclatura para os arquivos de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone para os timestamps nas migrations
timezone = UTC

# Encoding dos arquivos de migration
output_encoding = utf-8

# A DATABASE_URL é lida via config.py (Pydantic Settings) no env.py
# sqlalchemy.url não é definido aqui intencionalmente

[post_write_hooks]
# Rodar Ruff após geração automática de migrations
hooks = ruff
ruff.type = exec
ruff.executable = %(here)s/.venv/Scripts/ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
