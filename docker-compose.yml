services:
  postgres:
    image: postgres:16-alpine
    container_name: sales_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sales_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sales_agent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sales_agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sales_agent} -d ${POSTGRES_DB:-sales_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sales_agent_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: atendai/evolution-api:latest
    container_name: sales_agent_evolution
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_api_key}
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "true"
      REDIS_URI: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL:-http://backend:8000/webhooks/evolution}
      WEBHOOK_GLOBAL_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_agent_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sales_agent}:${POSTGRES_PASSWORD:-sales_agent_secret}@postgres:5432/${POSTGRES_DB:-sales_agent_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evolution_api_key}
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
